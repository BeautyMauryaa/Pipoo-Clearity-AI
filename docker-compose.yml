services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarity-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env # Copy backend/.env.example to backend/.env first
    restart: unless-stopped
    networks:
      - clarity-ai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: clarity-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - clarity-ai-net

networks:
  clarity-ai-net:
    driver: bridge

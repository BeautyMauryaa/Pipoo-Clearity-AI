version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipoo-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env      # MONGODB_URI, JWT_SECRET, etc. come from here (Atlas connection string included)
    restart: unless-stopped
    networks:
      - pipoo-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipoo-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pipoo-net

networks:
  pipoo-net:
    driver: bridge